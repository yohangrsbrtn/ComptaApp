<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Compta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #0f1830;
    --card: #131d36;
    --card2: #172144;
    --border: #223058;
    --text: #eef2ff;
    --muted: #8b96b8;
    --accent: #10b981;
    --accent2: #34d399;
    --gold: #f5c451;
    --red: #f87171;
    --blue: #60a5fa;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; background: radial-gradient(1200px 600px at 20% -10%, #142250 0%, transparent 60%), radial-gradient(1000px 500px at 100% 0%, #0f2b26 0%, transparent 55%), var(--bg); }
  input, select, textarea, button { font-family: inherit; font-size: 16px; }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; flex-shrink: 0; background: rgba(15,24,48,.7); backdrop-filter: blur(12px); border-right: 1px solid var(--border); padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--gold)); box-shadow: 0 0 14px var(--accent); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 14px; transition: .15s; user-select: none; }
  .nav-item:hover { background: var(--card); color: var(--text); }
  .nav-item.active { background: linear-gradient(135deg, rgba(16,185,129,.18), rgba(52,211,153,.06)); color: var(--accent2); box-shadow: inset 0 0 0 1px rgba(16,185,129,.25); }
  .nav-item .ic { width: 18px; text-align: center; }
  .sidebar-foot { margin-top: auto; padding: 10px 12px; }
  .btn-logout { width: 100%; padding: 10px; border-radius: 10px; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
  .btn-logout:hover { color: var(--red); border-color: var(--red); }
  .nav-more-item { display: none; }
  .nav-plus-sheet, .nav-plus-backdrop { display: none; }

  .main { flex: 1; min-width: 0; padding: 28px 34px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .page-title { font-size: 24px; font-weight: 800; }
  .page-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .grid { display: grid; gap: 16px; }
  .cards4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card.kpi { position: relative; overflow: hidden; }
  .card.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .card.kpi .value { font-size: 26px; font-weight: 800; margin-top: 8px; }
  .card.kpi .value.pos { color: var(--accent2); }
  .card.kpi .value.neg { color: var(--red); }
  .card.kpi .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; transition: .15s; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #0ea371); color: #06251b; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }
  .btn-danger { background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.3); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .badge-green { background: rgba(16,185,129,.15); color: var(--accent2); }
  .badge-red { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-gold { background: rgba(245,196,81,.15); color: var(--gold); }
  .badge-blue { background: rgba(96,165,250,.15); color: var(--blue); }
  .badge-muted { background: rgba(139,150,184,.15); color: var(--muted); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .field input, .field select, .field textarea { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; outline: none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(4,8,20,.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; }
  .search input { width: 100%; }
  .pill-tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px; }
  .pill-tab { padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .pill-tab.active { background: var(--accent); color: #06251b; }

  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; z-index: 200; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--accent); color: var(--accent2); }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
  .login-card .brand { justify-content: center; padding-bottom: 26px; font-size: 22px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 18px; height: 18px; }

  .nav-label-short { display: none; }

  @media (max-width: 860px) {
    html, body { overscroll-behavior-x: none; }
    .sidebar {
      position: fixed; left: 0; bottom: 0; top: auto; width: 100%; height: auto;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
      border-right: none; border-top: 1px solid var(--border); z-index: 50;
      touch-action: pan-y;
    }
    .brand, .sidebar-foot { display: none; }
    .nav-item[data-mobile-hide="1"] { display: none; }
    .nav-more-item { display: flex; }
    .nav-item { flex-direction: column; font-size: 10.5px; gap: 4px; padding: 8px 2px; white-space: nowrap; text-align: center; border-radius: 10px; }
    .nav-item .ic { font-size: 18px; }
    .nav-label-full { display: none; }
    .nav-label-short { display: block; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .main { padding: 18px 16px 90px; }
    .row2, .row3 { grid-template-columns: 1fr; }
    .nav-plus-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 55; }
    .nav-plus-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 56;
      background: var(--card); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px));
      flex-direction: column; gap: 2px;
      box-shadow: 0 -10px 30px rgba(0,0,0,.4);
    }
    .nav-plus-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; color: var(--text); font-weight: 600; font-size: 15px; }
    .nav-plus-item.active { color: var(--accent2); background: rgba(16,185,129,.1); }
    .nav-plus-item .ic { width: 20px; text-align: center; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="api.js"></script>
<script src="clients.js"></script>
<script src="paiements.js"></script>
<script src="factures.js"></script>
<script src="budget.js"></script>
<script src="chimie.js"></script>
<script src="addict.js"></script>
<script>
const S = { page: 'dashboard', clients: [], loading: false };

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

const NAV = [
  { id: 'dashboard', label: 'Tableau de bord', short: 'Accueil', ic: '◆' },
  { id: 'clients', label: 'Clients', short: 'Clients', ic: '◉' },
  { id: 'paiements', label: 'Paiements', short: 'Paies', ic: '€' },
  { id: 'factures', label: 'Factures', short: 'Factures', ic: '▤' },
  { id: 'budget', label: 'Budget mensuel', short: 'Budget', ic: '▦' },
  { id: 'chimie', label: 'Chimie', short: 'Chimie', ic: '⚗' },
  { id: 'addict', label: 'Addict Nutrition', short: 'Addict', ic: '✦' },
];

function setPage(p) { S.page = p; render(); }

async function loadClients(force) {
  if (S.clients.length && !force) return S.clients;
  S.clients = await sbSelect('compta_clients', 'select=*&order=nom.asc');
  return S.clients;
}

// Sur mobile, 7 onglets en bas devenaient minuscules et illisibles (9px, 7 colonnes
// serrées) — on n'en garde que 4 directement visibles, le reste passe dans "Plus"
// (feuille qui s'ouvre par-dessus). Le desktop n'est pas concerné : la sidebar
// classique affiche toujours les 7 pages normalement, rien ne change pour elle.
const NAV_MOBILE_PRIMAIRES = ['dashboard', 'paiements', 'budget', 'clients'];

function shell(innerHtml) {
  const navSecondaires = NAV.filter(n => !NAV_MOBILE_PRIMAIRES.includes(n.id));
  return `
  <div class="app">
    <div class="sidebar">
      <div class="brand"><span class="dot"></span> Compta</div>
      ${NAV.map(n => `<div class="nav-item ${S.page === n.id ? 'active' : ''}" data-mobile-hide="${NAV_MOBILE_PRIMAIRES.includes(n.id) ? '0' : '1'}" onclick="setPage('${n.id}')"><span class="ic">${n.ic}</span> <span class="nav-label-full">${n.label}</span><span class="nav-label-short">${n.short}</span></div>`).join('')}
      <div class="nav-item nav-more-item ${navSecondaires.some(n => n.id === S.page) ? 'active' : ''}" onclick="toggleNavPlus()"><span class="ic">⋯</span> <span class="nav-label-short">Plus</span></div>
      <div class="sidebar-foot" style="display:flex;gap:8px;align-items:center;">
        <button class="btn-logout" onclick="doLogout()" style="flex:1;">Déconnexion</button>
        <button class="btn-logout" onclick="openChangerMdpModal()" title="Changer le mot de passe" style="width:38px;flex:none;padding:10px 0;">⚙</button>
      </div>
    </div>
    <div id="nav-plus-sheet" class="nav-plus-sheet" style="display:none;">
      ${navSecondaires.map(n => `<div class="nav-plus-item ${S.page === n.id ? 'active' : ''}" onclick="setPage('${n.id}');toggleNavPlus(false)"><span class="ic">${n.ic}</span> ${n.label}</div>`).join('')}
    </div>
    <div id="nav-plus-backdrop" class="nav-plus-backdrop" style="display:none;" onclick="toggleNavPlus(false)"></div>
    <div class="main">${innerHtml}</div>
  </div>`;
}

function toggleNavPlus(force) {
  const sheet = document.getElementById('nav-plus-sheet');
  const backdrop = document.getElementById('nav-plus-backdrop');
  const show = force !== undefined ? force : sheet.style.display === 'none';
  sheet.style.display = show ? 'flex' : 'none';
  backdrop.style.display = show ? 'block' : 'none';
}

function doLogout() { logout(); render(); }

function openChangerMdpModal() {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>Changer le mot de passe</h3>
    <div class="field"><label>Nouveau mot de passe</label><input id="mdp-nouveau" type="password" placeholder="Au moins 8 caractères"></div>
    <div class="field"><label>Confirmer le nouveau mot de passe</label><input id="mdp-confirm" type="password"></div>
    <div id="mdp-err" style="color:var(--red);font-size:13px;margin-bottom:10px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').remove()">Annuler</button>
      <button class="btn btn-primary" onclick="changerMotDePasse()">Enregistrer</button>
    </div>
  </div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}

async function changerMotDePasse() {
  const nouveau = document.getElementById('mdp-nouveau').value;
  const confirm = document.getElementById('mdp-confirm').value;
  const errEl = document.getElementById('mdp-err');
  errEl.textContent = '';
  if (nouveau.length < 8) { errEl.textContent = 'Le mot de passe doit faire au moins 8 caractères.'; return; }
  if (nouveau !== confirm) { errEl.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: supaHeaders(),
      body: JSON.stringify({ password: nouveau }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || 'Erreur');
    document.querySelector('.modal-bg')?.remove();
    toast('Mot de passe changé', 'ok');
  } catch (e) { errEl.textContent = e.message; }
}

function renderLogin() {
  document.getElementById('root').innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="dot"></span> Compta</div>
      <form id="li-form">
        <div class="field"><label>Email</label><input id="li-email" name="email" type="email" autocomplete="username" value="yohangrsbrtn@gmail.com"></div>
        <div class="field"><label>Mot de passe</label><input id="li-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div id="li-err" style="color:var(--red);font-size:13px;margin-bottom:10px;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Se connecter</button>
      </form>
    </div>
  </div>`;
  document.getElementById('li-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  const err = document.getElementById('li-err');
  err.textContent = '';
  try {
    await login(email, pass);
    // Sans ce submit "réussi" via un vrai <form>, les navigateurs (surtout mobile)
    // ne proposaient jamais d'enregistrer le mot de passe — d'où la reconnexion
    // manuelle à chaque fois en plus de l'expiration de session déjà corrigée.
    await render();
  } catch (e) { err.textContent = e.message; }
}

async function renderDashboard() {
  await loadClients();
  const mois = moisActuel();
  const moisCourantIdx = MOIS.indexOf(mois);
  const [paiements, factures, paiementsAnnee, lignesAnnee] = await Promise.all([
    sbSelect('compta_paiements', `mois=eq.${encodeURIComponent(mois)}&annee=eq.2026`),
    sbSelect('compta_factures', 'select=montant_total,mois&annee=eq.2026'),
    sbSelect('compta_paiements', 'select=mois,mt_suivi,mt_seance&annee=eq.2026'),
    sbSelect('compta_budget_lignes', 'select=mois,type,montant&annee=eq.2026'),
  ]);
  const totalMoisSuivi = paiements.reduce((s, p) => s + Number(p.mt_suivi || 0), 0);
  const actifs = S.clients.filter(c => c.statut !== 'ancien').length;
  const totalFactureAnnee = factures.reduce((s, f) => s + Number(f.montant_total || 0), 0);

  const moisAffiches = MOIS.slice(0, moisCourantIdx + 1);
  const revenuCoaching = moisAffiches.map(m => paiementsAnnee
    .filter(p => p.mois === m).reduce((s, p) => s + Number(p.mt_suivi || 0) + Number(p.mt_seance || 0), 0));
  const parType = t => moisAffiches.map(m => lignesAnnee
    .filter(l => l.mois === m && l.type === t).reduce((s, l) => s + Number(l.montant || 0), 0));

  const serieChart = [
    { label: 'Revenus coaching', color: 'var(--accent2)', values: revenuCoaching },
    { label: 'Dépenses fixes', color: 'var(--red)', values: parType('depense_fixe') },
    { label: 'Dépenses variables', color: 'var(--gold)', values: parType('depense_variable') },
    { label: 'Épargne', color: 'var(--blue)', values: parType('epargne') },
    { label: 'Crédits', color: '#c084fc', values: parType('credit') },
  ];

  document.getElementById('root').innerHTML = shell(`
    <div class="topbar">
      <div><div class="page-title">Tableau de bord</div><div class="page-sub">${mois} 2026</div></div>
    </div>
    <div class="grid cards4" style="margin-bottom:22px;">
      <div class="card kpi"><div class="label">Clients actifs</div><div class="value">${actifs}</div><div class="sub">${S.clients.length} au total</div></div>
      <div class="card kpi"><div class="label">Suivis encaissés (${mois.slice(0,4)})</div><div class="value pos">${fmtEUR(totalMoisSuivi)}</div></div>
      <div class="card kpi"><div class="label">Total facturé 2026</div><div class="value">${fmtEUR(totalFactureAnnee)}</div></div>
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div style="font-weight:700;margin-bottom:14px;">Évolution des dépenses et des revenus de coaching — 2026</div>
      ${_svgEvolutionChart(moisAffiches, serieChart)}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
      <div class="card" style="cursor:pointer;" onclick="setPage('paiements')"><div style="font-weight:700;margin-bottom:6px;">€ Paiements du mois</div><div class="page-sub">Cocher les encaissements, générer les factures</div></div>
      <div class="card" style="cursor:pointer;" onclick="setPage('clients')"><div style="font-weight:700;margin-bottom:6px;">◉ Base clients</div><div class="page-sub">Gérer coaching, tarifs, adresses</div></div>
      <div class="card" style="cursor:pointer;" onclick="setPage('budget')"><div style="font-weight:700;margin-bottom:6px;">▦ Budget mensuel</div><div class="page-sub">Revenus, dépenses, épargne, trésorerie</div></div>
    </div>
  `);
}

// Petit graphique multi-lignes en SVG à la main — pas de dépendance CDN pour un
// simple dashboard, mêmes couleurs que les badges déjà utilisés dans l'app.
function _svgEvolutionChart(moisLabels, series) {
  const W = 900, H = 300, padL = 55, padR = 16, padT = 16, padB = 34;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = moisLabels.length;
  const maxVal = Math.max(1, ...series.flatMap(s => s.values));
  const x = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const y = v => padT + innerH - (v / maxVal) * innerH;

  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const val = maxVal * f;
    const yy = y(val);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmtEUR(val).replace(',00','')}</text>`;
  }).join('');

  const xLabels = moisLabels.map((m, i) => `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${m.slice(0,3)}</text>`).join('');

  const lines = series.map(s => {
    const pts = s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    const dots = s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2"/>${dots}`;
  }).join('');

  const legend = series.map(s => `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px;color:var(--muted);"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block;"></span>${s.label}</span>`).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${grid}
      ${lines}
      ${xLabels}
    </svg>
    <div style="margin-top:10px;">${legend}</div>`;
}

async function render() {
  if (!isLoggedIn()) { renderLogin(); return; }
  try {
    if (S.page === 'dashboard') await renderDashboard();
    else if (S.page === 'clients') await renderClients();
    else if (S.page === 'paiements') await renderPaiements();
    else if (S.page === 'factures') await renderFactures();
    else if (S.page === 'budget') await renderBudget();
    else if (S.page === 'chimie') await renderChimie();
    else if (S.page === 'addict') await renderAddict();
  } catch (e) {
    console.error(e);
    toast('Erreur : ' + e.message, 'err');
  }
}

render();

// GitHub Pages impose 10 min de cache HTTP sur toutes les pages, sans possibilité de
// le réduire (pas d'en-têtes personnalisables comme sur Netlify/Vercel) — plutôt que
// de laisser l'app rester silencieusement périmée jusqu'à expiration du cache, on
// détecte tout seul qu'un nouveau déploiement est en ligne (l'ETag de la page a changé)
// et on propose un rechargement en un clic, sans devoir vider le cache à la main.
let _appEtag = null;
async function _checkAppUpdate() {
  try {
    const res = await fetch(location.pathname + '?_chk=' + Date.now(), { cache: 'no-store' });
    const etag = res.headers.get('etag');
    if (!etag) return;
    if (_appEtag === null) { _appEtag = etag; return; }
    if (etag !== _appEtag && !document.getElementById('maj-dispo-bandeau')) {
      const b = document.createElement('div');
      b.id = 'maj-dispo-bandeau';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:300;background:var(--accent2);color:#06251b;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:13.5px;';
      b.innerHTML = `<span>Nouvelle version disponible</span><button style="background:#06251b;color:var(--accent2);border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;" onclick="location.reload()">Recharger</button>`;
      document.body.appendChild(b);
    }
  } catch { /* pas grave, on retentera au prochain cycle */ }
}
setInterval(_checkAppUpdate, 90000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) _checkAppUpdate(); });
</script>
